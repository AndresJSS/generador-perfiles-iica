<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Perfiles Profesionales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-200 min-h-screen p-6 font-sans text-slate-800">

    <div class="flex flex-col lg:flex-row gap-8 max-w-[1400px] mx-auto">
        
        <!-- COLUMNA IZQUIERDA: PANEL DE CONTROL -->
        <div class="w-full lg:w-1/3 xl:w-1/4 shrink-0">
            <div id="control-panel" class="bg-white p-6 rounded-xl shadow-lg border border-slate-200 sticky top-6">
                <h1 class="text-xl font-bold text-slate-800 mb-6 border-b pb-3">Generador de Perfiles</h1>
                
                <div class="flex flex-col gap-5 mb-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Representación</label>
                        <!-- Las opciones se generarán automáticamente desde el Excel -->
                        <select id="officeSelect" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-600 outline-none bg-white">
                            <option value="">Cargando sedes...</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Fecha del Documento</label>
                        <input type="text" id="dateInput" placeholder="DD/MM/YYYY" 
                               class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-600 outline-none">
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-100">
                    <button id="btnDownload" disabled
                            class="w-full bg-blue-700 hover:bg-blue-800 disabled:bg-slate-400 text-white font-semibold py-3 px-6 rounded-lg transition shadow-md flex justify-center items-center gap-2">
                        Cargando base de datos...
                    </button>
                </div>
            </div>
        </div>

        <!-- COLUMNA DERECHA: VISTA PREVIA -->
        <div class="w-full lg:w-2/3 xl:w-3/4 flex-1">
            <div id="pdf-container" class="flex flex-col items-center">
                <div class="bg-white p-10 rounded-xl border border-dashed border-slate-300 text-center text-slate-400 w-full max-w-[210mm]" id="empty-state">
                    <svg class="w-12 h-12 mx-auto mb-3 animate-spin text-blue-500" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    Conectando con el archivo de perfiles...
                </div>
            </div>
        </div>
        
    </div>

    <script src="script.js"></script>
</body>
</html>
